name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      PUPPETEER_NO_SANDBOX: 1
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository hygiene checks
        run: npm run repo:check

      - name: Run static, unit, and build checks
        run: npm run verify

      - name: Run browser checks
        shell: bash
        run: |
          set +e
          npm run test:e2e 2>&1 | tee /tmp/resume-e2e.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            node -e "const fs=require('node:fs'); const detail=fs.readFileSync('/tmp/resume-e2e.log','utf8').trim().split('\\n').slice(-60).join('\\n').replace(/%/g,'%25').replace(/\\r/g,'%0D').replace(/\\n/g,'%0A'); console.log('::error title=E2E browser test::'+detail);"
          fi
          exit "$test_status"
